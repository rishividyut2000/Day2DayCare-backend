[project]
name = "day2daycare-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2.8,<6.0",   # 5.2 LTS: supports Python 3.14, security until Apr 2028
    "djangorestframework>=3.15",
    "django-tenants>=3.14",  # requires Django >=5.2
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
    "psycopg[binary]>=3.1",
    "django-environ>=0.11",
    "django-cors-headers>=4.3",
    "django-filter>=24.1",
    "argon2-cffi>=23.1",
    "celery>=5.3",
    "redis>=5.0",
    "django-celery-beat>=2.6",
    "boto3>=1.34",
    "django-storages>=1.14",
    "weasyprint>=61.0",
    "gunicorn>=22.0",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "testcontainers[postgres]>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "django-stubs>=5.0",
    "djangorestframework-stubs>=3.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "DJ", "S", "C4"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict_optional = true
warn_unused_ignores = true

[tool.django-stubs]
django_settings_module = "config.settings.local"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--reuse-db --strict-markers"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["apps", "config"]