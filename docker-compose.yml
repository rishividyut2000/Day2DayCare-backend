services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: d2d
      POSTGRES_PASSWORD: d2d
      POSTGRES_DB: d2d
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U d2d"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes: [".:/app"]
    ports: ["8000:8000"]
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: .
    command: celery -A config worker -l info
    volumes: [".:/app"]
    env_file: .env
    depends_on: [db, redis]

  beat:
    build: .
    command: celery -A config beat -l info
    volumes: [".:/app"]
    env_file: .env
    depends_on: [db, redis]

volumes:
  pgdata:
